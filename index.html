<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TI de Bolso · Resposta registrada</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 20% 0%,#16224a 0%,#0B1020 55%);color:#EEF2FA;font-family:Inter,Arial,sans-serif}
  .card{width:100%;max-width:520px;background:#111a33;border:1px solid #243150;border-radius:20px;padding:36px 32px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
  .tag{font-family:"Courier New",monospace;font-size:12px;letter-spacing:3px;color:#22D3EE}
  .top img{height:20px}
  .check{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:rgba(52,211,153,.12);display:flex;align-items:center;justify-content:center;
    animation:pop .5s ease-out}
  .check svg{width:44px;height:44px}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  h1{font-family:Sora,Arial,sans-serif;font-size:28px;line-height:1.2;margin-bottom:12px}
  .pick{display:inline-block;margin:6px 0 18px;padding:10px 18px;border-radius:12px;background:#1d2850;border:2px solid #8B5CF6;font-size:16px}
  .pick b{color:#C4B5FD}
  p{color:#B6C0D8;font-size:15px;line-height:1.6}
  .hint{margin-top:18px;font-size:13px;color:#8A96B5}
  a.btn{display:inline-block;margin-top:26px;padding:12px 22px;border-radius:12px;background:#22D3EE;color:#0B1020;font-weight:600;text-decoration:none}
  a.btn:hover{background:#67e8f9}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <span class="tag" id="tag">// TI DE BOLSO</span>
    <img src="https://raw.githubusercontent.com/RobertSoaresiTease/itease-artes/main/marca/logo-branco.png" alt="iTease">
  </div>
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>Resposta registrada! 🎉</h1>
  <div class="pick" id="pick" hidden>Você escolheu a alternativa <b id="letter"></b></div>
  <p>A resposta certa sai na próxima <strong>TI de Bolso</strong>, sexta às 9h. Fique de olho no seu e-mail!</p>
  <p class="hint">Vale o primeiro clique. Se clicar em outra alternativa agora, conta a primeira. 😉</p>
  <a class="btn" href="https://www.itease.com.br">Conhecer a iTease</a>
</main>
<script>
  var q=new URLSearchParams(location.search);
  var r=(q.get('resposta')||'').trim().toUpperCase();
  var d=(q.get('desafio')||'').replace(/[^0-9]/g,'');
  if(/^[A-E]$/.test(r)){document.getElementById('letter').textContent=r+')';document.getElementById('pick').hidden=false;}
  if(d){document.getElementById('tag').textContent='// TI DE BOLSO · #'+d;}
</script>
</body>
</html>
